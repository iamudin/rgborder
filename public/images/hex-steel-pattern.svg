<svg xmlns="http://www.w3.org/2000/svg" width="56" height="96" viewBox="0 0 56 96">
  <defs>
    <!-- Steel Metallic Gradient -->
    <linearGradient id="steel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Outer Glow / Cyber Reflection -->
    <linearGradient id="neon-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="rivet-head" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#475569" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Hexagonal Honeycomb Steel Outer Framing (Paths) -->
  <!-- Top Center Hexagon -->
  <path d="M28,0 L56,16 L56,48 L28,64 L0,48 L0,16 Z" 
        fill="none" 
        stroke="url(#steel-metal)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
        
  <!-- Inner chamfer rim for 3D metallic bevel effect -->
  <path d="M28,3 L53,17.5 L53,46.5 L28,61 L3,46.5 L3,17.5 Z" 
        fill="none" 
        stroke="#000000" 
        stroke-opacity="0.4" 
        stroke-width="1.2" 
        stroke-linejoin="round"/>

  <!-- Offset Lower Hexagon -->
  <path d="M28,48 L56,64 L56,96 L28,112 L0,96 L0,64 Z" 
        fill="none" 
        stroke="url(#steel-metal)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Inner chamfer for lower hex -->
  <path d="M28,51 L53,65.5 L53,94.5 L28,109 L3,94.5 L3,65.5 Z" 
        fill="none" 
        stroke="#000000" 
        stroke-opacity="0.4" 
        stroke-width="1.2" 
        stroke-linejoin="round"/>

  <!-- Corner wrapping hexes for perfect seamless repeat -->
  <path d="M-28,48 L0,64 L0,96 L-28,112 L-56,96 L-56,64 Z" 
        fill="none" 
        stroke="url(#steel-metal)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
  <path d="M84,48 L112,64 L112,96 L84,112 L56,96 L56,64 Z" 
        fill="none" 
        stroke="url(#steel-metal)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Rivet / Tactical Steel Bolts at Vertices -->
  <circle cx="28" cy="0" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="56" cy="16" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="0" cy="16" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="56" cy="48" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="0" cy="48" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="28" cy="64" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="56" cy="80" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="0" cy="80" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="28" cy="96" r="1.8" fill="url(#rivet-head)" stroke="#090d16" stroke-width="0.5"/>
</svg>
